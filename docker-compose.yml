services:
  db:
    image: postgres:16-alpine
    container_name: smart_pali_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_pali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_pali_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-smart_pali_prod}
    volumes:
      - smart_pali_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Exposed on host port 5433 to avoid conflict with local postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smart_pali} -d $${POSTGRES_DB:-smart_pali_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - smart_pali_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_pali_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_pali}:${POSTGRES_PASSWORD:-smart_pali_secure_pass_2026}@db:5432/${POSTGRES_DB:-smart_pali_prod}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-e3lUak1mOG9aNHExYVd0cTNmN2g0ajlyOHkyZXNxMXo=}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:-http://localhost:3010}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - smart_pali_uploads:/app/public/uploads
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - smart_pali_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: smart_pali_tunnel
    restart: unless-stopped
    command: tunnel --url http://app:3010 --no-autoupdate
    depends_on:
      app:
        condition: service_healthy
    networks:
      - smart_pali_net

volumes:
  smart_pali_db_data:
    name: smart_pali_db_data
  smart_pali_uploads:
    name: smart_pali_uploads

networks:
  smart_pali_net:
    name: smart_pali_net
    driver: bridge
